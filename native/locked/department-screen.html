  const chart = s.chart ? `<div class="view" data-view="chart"><div class="card"><svg class="map" viewBox="0 0 760 250" role="img" aria-label="Chart"><path class="hand" d="M150 70 L 260 70"/><text class="lbl" x="160" y="60">application file, version 4</text><path class="hand warn" d="M370 70 L 480 70"/><text class="lbl" x="372" y="60">KYC verdict, version 1 in use</text><path class="hand warn" d="M315 100 L 315 150 L 590 150 L 590 180"/><text class="lbl" x="330" y="142">KYC verdict, version 1 in use</text><path class="hand" d="M535 100 L 535 180"/><text class="lbl" x="545" y="140">ledger lines, version 2</text><path class="hand" d="M260 210 L 480 210"/><text class="lbl" x="300" y="202">mandate list, version 3</text><rect class="box" x="40" y="40" width="110" height="60" rx="9"/><text x="58" y="75">Origination</text><rect class="box on" x="260" y="40" width="110" height="60" rx="9"/><text x="275" y="75">Underwriting</text><rect class="box" x="480" y="40" width="110" height="60" rx="9"/><text x="507" y="75">Servicing</text><rect class="box" x="480" y="180" width="110" height="60" rx="9"/><text x="498" y="215">Compliance</text><rect class="box" x="120" y="180" width="140" height="60" rx="9" stroke-dasharray="4 3"/><text x="150" y="205">Bank move</text><text class="lbl" x="150" y="222">until 30 October</text><rect class="box" x="640" y="110" width="100" height="50" rx="9" stroke-dasharray="4 3"/><text x="656" y="140">RBI audit</text></svg></div></div>` : "";
  const viewer = `<div class="col" id="viewer"><div class="strip"><span class="dot ok live"></span><h1>${esc(s.name)}</h1><span class="cap">${esc(s.cap)}</span>${chartBtn}<span class="ib pencil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4l10-10-4-4L4 16v4z"/></svg></span></div>${nowView}${glueViews}${workViews}${filedViews}${plain}${chart}
    <div class="foot"><span><span class="dot ok"></span>passed</span><span><span class="dot warn"></span>needs a look</span><span><span class="dot block"></span>refused or stopped</span><span><span class="dot ok live"></span>running</span><span><span class="dot warn live"></span>waits</span></div></div>`;
  const app = document.getElementById("app");
  app.classList.toggle("narrow", narrow);
  app.innerHTML = rail + tree + list + viewer;
  startFeed(s);
}
let timer = null, feedI = 0, cost = 0;
function startFeed(s){
  if (timer) clearTimeout(timer);
  feedI = 0; cost = s.charter.spend;
  const rows = document.getElementById("rows");
  const add = () => {
    if (feedI >= s.feed.length) return;
    const [n, c, st, t, m, d] = s.feed[feedI++];
    rows.querySelectorAll(".row.now").forEach(r => r.classList.remove("now"));
    const el = document.createElement("div"); el.className = "row now";
    el.innerHTML = `<span class="dot ${dotOf(st)}"></span><span>${esc(n)}<div class="chk">${esc(c)}</div></span><span class="t">${esc(m)}</span><span class="t">${esc(t)}</span><span class="t">${esc(d)}</span>`;
    rows.prepend(el); while (rows.children.length > 6) rows.lastChild.remove();
    cost = Math.min(92, cost + 5); const bar = document.getElementById("cost"); if (bar) bar.style.width = cost + "%";
    timer = setTimeout(add, 2600);
  };
  timer = setTimeout(add, 600);
}
document.addEventListener("click", ev => {
  if (ev.target.closest("#chev")){ narrow = !narrow; render(current); return; }
  const md = ev.target.closest(".mode"); if (md){ const cd = md.closest(".card"); cd.querySelectorAll(".mode").forEach(x => x.classList.toggle("on", x === md)); cd.querySelectorAll(".mpane").forEach(p => p.classList.toggle("on", p.dataset.mpane === md.dataset.mode)); return; }
  const tb = ev.target.closest(".tab"); if (tb){ const v = tb.closest(".view"); v.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === tb)); v.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.dataset.pane === tb.dataset.tab)); return; }
  const g = ev.target.closest(".acc .grp"); if (g){ const a = g.parentElement, t = a.dataset.acc; a.classList.toggle("shut"); if (a.classList.contains("shut")) shut.add(t); else shut.delete(t); return; }
  const sw = ev.target.closest("[data-sys]"); if (sw){ render(sw.dataset.sys); return; }
  const el = ev.target.closest("[data-open]"); if (!el) return;
  const v = el.dataset.open;
  document.querySelectorAll(".view").forEach(x => x.classList.toggle("on", x.dataset.view === v));
  document.querySelectorAll("#list .li").forEach(x => x.classList.toggle("on", x.dataset.open === v));
  const cb = document.getElementById("chartbtn"); if (cb) cb.classList.toggle("on", v === "chart");
  const viewer = document.getElementById("viewer"); if (viewer && window.innerWidth <= 980) viewer.scrollIntoView({ behavior: "smooth", block: "start" });
});
render("servicing");
</script>
